<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibo - Amparo HAZAQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    
    /* ESTILO DE IMPRESSÃO PAISAGEM / PDF */
    @media print {
      @page {
        size: landscape;
        margin: 5mm;
      }
      .no-print {
        display: none !important;
      }
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      .recibo-card {
        border: 2px solid #000000 !important;
        box-shadow: none !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        max-width: 100% !important;
        width: 100% !important;
        padding: 15px !important;
      }
      input, select {
        border-color: #000000 !important;
        color: #000000 !important;
        background-color: transparent !important;
        font-weight: bold !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

  <!-- CARD DO RECIBO (FUNDO BRANCO E TEXTOS PRETO INTENSO) -->
  <div class="recibo-card max-w-4xl w-full bg-white text-black border-2 border-black rounded-xl p-6 shadow-2xl">
    
    <!-- CABEÇALHO COM LOGO -->
    <div class="flex flex-col items-center border-b-2 border-black pb-3 mb-4 text-center">
      <img src="logo-512.png" alt="Logo Amparo HAZAQ" class="w-full max-h-20 mb-1 object-contain" onerror="this.src='https://via.placeholder.com/600x100/ffffff/000000?text=AMPARO+HAZAQ'">
      <h1 class="text-2xl font-black tracking-wider text-black uppercase">AMPARO HAZAQ</h1>
      <p class="text-xs font-bold tracking-widest text-black uppercase">Suporte Emocional e Comportamental Psicobíblico</p>
      <div class="mt-1 text-xs font-bold text-black">
        <span>escolateologicavance@gmail.com</span> | <span>(66) 98466-6186</span> | <span>Itanhangá - MT - BR</span>
      </div>
    </div>

    <!-- TÍTULO DO RECIBO -->
    <div class="flex justify-between items-center mb-4 border-b border-black pb-2">
      <h2 class="text-lg font-black text-black uppercase tracking-wide">RECIBO DE CONTRIBUIÇÃO</h2>
      <span class="text-sm font-black text-black">Nº <input type="text" id="numRecibo" value="0001" class="border-b-2 border-black w-20 text-center font-black text-black focus:outline-none"></span>
    </div>

    <!-- FORMULÁRIO EM PAISAGEM -->
    <form id="reciboForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- COLUNA DA ESQUERDA -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-black text-black uppercase mb-1">Recebemos de (Contribuinte):</label>
          <input type="text" id="nomeContribuinte" placeholder="Nome Completo" required class="w-full bg-white border-2 border-black rounded-lg px-3 py-2 text-sm font-bold text-black focus:outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-black text-black uppercase mb-1">Valor (R$):</label>
            <input type="text" id="valorContrib" placeholder="0,00" required class="w-full bg-white border-2 border-black rounded-lg px-3 py-2 text-sm font-black text-black focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-black text-black uppercase mb-1">Data:</label>
            <input type="date" id="dataContrib" required class="w-full bg-white border-2 border-black rounded-lg px-3 py-2 text-sm font-bold text-black focus:outline-none">
          </div>
        </div>

        <!-- CAMPO DE WHATSAPP -->
        <div class="no-print bg-amber-50 p-3 rounded-lg border-2 border-amber-500">
          <label class="block text-xs font-black text-black uppercase mb-1">📱 WhatsApp do Contribuinte (com DDD):</label>
          <input type="tel" id="whatsappContribuinte" placeholder="Ex: 66984666186" class="w-full bg-white border-2 border-black rounded-lg px-3 py-2 text-sm font-bold text-black focus:outline-none">
        </div>
      </div>

      <!-- COLUNA DA DIREITA -->
      <div class="space-y-3 flex flex-col justify-between">
        <div>
          <label class="block text-xs font-black text-black uppercase tracking-wider mb-2">Modalidade da Contribuição:</label>
          
          <div class="space-y-2 text-xs font-bold text-black">
            <div class="border-2 border-black p-2 rounded-lg flex items-center space-x-6">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="modalidade" value="Mensalidade" class="w-4 h-4 text-black border-black">
                <span class="font-black">Mensalidade</span>
              </label>
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="modalidade" value="Anuidade" class="w-4 h-4 text-black border-black">
                <span class="font-black">Anuidade</span>
              </label>
            </div>

            <div class="border-2 border-black p-2 rounded-lg space-y-1.5">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="modalidade" value="Bolsa" class="w-4 h-4 text-black border-black">
                <span class="font-black">Bolsa</span>
              </label>
              <input type="text" id="investidorBolsa" placeholder="Nome do Investidor / Padrinho" class="w-full border border-black rounded px-2 py-1 text-xs font-bold text-black focus:outline-none">
            </div>

            <div class="border-2 border-black p-2 rounded-lg flex items-center justify-between">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="radio" name="modalidade" value="Bolsa-Presente" class="w-4 h-4 text-black border-black">
                <span class="font-black">Bolsa-Presente</span>
              </label>
              <span class="text-xs font-black text-black border border-black px-2 py-0.5 rounded bg-gray-100">Investidor: HAZAQ</span>
            </div>
          </div>
        </div>

        <!-- ASSINATURA -->
        <div class="pt-4 text-center">
          <div class="border-t-2 border-black w-3/4 mx-auto pt-1">
            <p class="text-xs font-black text-black uppercase">Tesouraria / Administração Amparo HAZAQ</p>
          </div>
        </div>
      </div>

    </form>

    <!-- BOTÕES DE AÇÃO -->
    <div class="no-print grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4 border-t-2 border-black mt-4">
      <button type="button" onclick="enviarWhatsApp()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2.5 rounded-lg text-xs uppercase tracking-wider transition flex items-center justify-center gap-1">
        📲 Enviar WhatsApp
      </button>
      <button type="button" onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-2.5 rounded-lg text-xs uppercase tracking-wider transition flex items-center justify-center gap-1">
        🖨️ Imprimir / Gerar PDF
      </button>
      <a href="index.html" class="text-center bg-gray-800 hover:bg-gray-900 text-white font-black py-2.5 rounded-lg text-xs uppercase tracking-wider transition flex items-center justify-center">
        ⬅️ Voltar ao Menu
      </a>
    </div>

  </div>

  <script>
    // Preenche a data de hoje por padrão
    document.getElementById('dataContrib').valueAsDate = new Date();

    function enviarWhatsApp() {
      const nome = document.getElementById('nomeContribuinte').value.trim();
      const valor = document.getElementById('valorContrib').value.trim();
      const data = document.getElementById('dataContrib').value;
      const numRecibo = document.getElementById('numRecibo').value.trim();
      let whatsapp = document.getElementById('whatsappContribuinte').value.replace(/\D/g, '');
      
      const radioModalidades = document.getElementsByName('modalidade');
      let modalidadeSelecionada = "Não especificada";
      for (const radio of radioModalidades) {
        if (radio.checked) {
          modalidadeSelecionada = radio.value;
          break;
        }
      }

      let investidorInfo = "";
      if (modalidadeSelecionada === "Bolsa") {
        const investidor = document.getElementById('investidorBolsa').value.trim();
        if (investidor) investidorInfo = ` (Investidor: ${investidor})`;
      } else if (modalidadeSelecionada === "Bolsa-Presente") {
        investidorInfo = " (Investidor: HAZAQ)";
      }

      if (!nome || !valor) {
        alert("Por favor, preencha o Nome do Contribuinte e o Valor.");
        return;
      }

      if (!whatsapp) {
        alert("Por favor, digite o número do WhatsApp com DDD.");
        document.getElementById('whatsappContribuinte').focus();
        return;
      }

      // Garante o código do país (55)
      if (whatsapp.length <= 11) {
        whatsapp = '55' + whatsapp;
      }

      const dataFormatada = data ? data.split('-').reverse().join('/') : '';

      const mensagemTexto = `*RECIBO DE CONTRIBUIÇÃO - AMPARO HAZAQ*\n` +
        `*Nº:* ${numRecibo}\n` +
        `----------------------------------------\n` +
        `*Recebemos de:* ${nome}\n` +
        `*Valor:* R$ ${valor}\n` +
        `*Data:* ${dataFormatada}\n` +
        `*Modalidade:* ${modalidadeSelecionada}${investidorInfo}\n` +
        `----------------------------------------\n` +
        `*Amparo HAZAQ* - Suporte Emocional e Comportamental Psicobíblico\n` +
        `escolateologicavance@gmail.com | (66) 98466-6186 | Itanhangá-MT-BR`;

      const urlWhatsApp = `https://wa.me/${whatsapp}?text=${encodeURIComponent(mensagemTexto)}`;
      
      // Abre o WhatsApp diretamente
      window.location.href = urlWhatsApp;
    }
  </script>
</body>
</html>
